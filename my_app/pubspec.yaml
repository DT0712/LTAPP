name: my_app
description: A new Flutter project
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  dio: ^5.3.0

  # Firebase core (bắt buộc)
  firebase_core: ^3.15.2

  # Firebase Authentication (đăng nhập, đăng ký)
  firebase_auth: ^5.3.0

  # Tuỳ chọn nếu bạn sẽ dùng Firestore (lưu thông tin người dùng, v.v.)
  cloud_firestore: ^5.6.12

  # Nếu app của bạn có hiển thị ảnh từ Firebase Storage
  firebase_storage: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/DanhMuc/
    - assets/images/DiaDiem/
    - assets/images/Banner.jpg
