name: my_app
description: A new Flutter project
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icon Font Awesome
  font_awesome_flutter: ^10.7.0

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  dio: ^5.3.0

  # Firebase core (bắt buộc)
  firebase_core: ^3.15.2

  # Firebase Authentication (đăng nhập, đăng ký)
  firebase_auth: ^5.3.0

  # Firestore database
  cloud_firestore: ^5.6.12

  # Firebase Storage (nếu có dùng ảnh)
  firebase_storage: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/DanhMuc/
    - assets/images/DiaDiem/
    - assets/images/food/
    - assets/images/Banner.jpg
